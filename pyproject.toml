[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pang2p"
version = "0.1.0"
description = "Pangenome-informed Genome-to-Phenome Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "snakemake>=9",
    "pandas",
    "pyyaml"
]
classifiers = [
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
pang2p = "pang2p.pang2p:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pang2p = [
    "workflow/Snakefile",
    "workflow/config.yaml",
    "workflow/rules/*.smk",
    "workflow/envs/*.yaml",
    "workflow/scripts/*",
]
